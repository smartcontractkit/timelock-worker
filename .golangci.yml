run:
  timeout: 10m
  tests: false
  modules-download-mode: readonly
linters:
  disable-all: true # Consider removing this to enable all default linters
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck # Default linter
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - gochecknoinits
    - goconst
    - godot
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - gosimple # Default linter
    - govet # Default linter
    - ineffassign # Default linter
    - intrange
    - loggercheck
    - makezero
    - misspell
    # - mnd
    - nakedret
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - reassign
    # - revive
    - staticcheck # Default linter
    - testifylint
    - tenv
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
linters-settings:
  goconst:
    min-len: 5
  goimports:
    local-prefixes: github.com/smartcontractkit/timelock-worker
  nlreturn:
    block-size: 2
issues:
  exclude-dirs:
    # Exclude the directory containing generated geth bindings
    - pkg/contracts
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam # No need to check for unused parameters in tests, since there are often false positives
